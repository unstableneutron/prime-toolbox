[project]
name = "prime-fff-repo-search"
version = "0.1.0"
description = "Prime Agent skill client for the shared fff-routerd repository search service"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=1.29,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fff_repo_search"]
