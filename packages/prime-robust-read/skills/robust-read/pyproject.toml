[project]
name = "prime_robust_read"
version = "0.1.0"
description = "Bounded, format-aware file reading and safe mutation for Prime Agent"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
  "firecrawl-anydoc==0.1.7",
  "pdf-inspector==0.2.6",
]

[dependency-groups]
dev = [
  "reportlab==5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prime_robust_read"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
