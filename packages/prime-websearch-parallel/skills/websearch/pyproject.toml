[project]
# Match the bundled distribution name so an editable install replaces it cleanly.
name = "prime-agent-skill-websearch"
version = "0.1.0"
description = "Serper and Parallel web search skill for Prime Agent."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
websearch = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/websearch"]
